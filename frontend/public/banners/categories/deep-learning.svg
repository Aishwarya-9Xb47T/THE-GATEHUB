<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="dlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>
    <linearGradient id="dlNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="dlGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dlGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a855f7" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#dlBg)"/>
  <rect width="100%" height="100%" fill="url(#dlGrid)"/>

  <!-- Ambient Glow -->
  <circle cx="640" cy="275" r="280" fill="url(#dlGlow)"/>

  <!-- Multi-Layer Neural Network -->
  <g transform="translate(640, 260)">
    <!-- Synaptic Connections (Layer 1 -> Layer 2) -->
    <line x1="-160" y1="-80" x2="-50" y2="-90" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="-160" y1="-80" x2="-50" y2="-30" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="-160" y1="-80" x2="-50" y2="30" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="-160" y1="-80" x2="-50" y2="90" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.3"/>

    <line x1="-160" y1="0" x2="-50" y2="-90" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="-160" y1="0" x2="-50" y2="-30" stroke="#c084fc" stroke-width="2.5" stroke-opacity="0.7"/>
    <line x1="-160" y1="0" x2="-50" y2="30" stroke="#c084fc" stroke-width="2.5" stroke-opacity="0.7"/>
    <line x1="-160" y1="0" x2="-50" y2="90" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.5"/>

    <line x1="-160" y1="80" x2="-50" y2="-90" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.3"/>
    <line x1="-160" y1="80" x2="-50" y2="-30" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="-160" y1="80" x2="-50" y2="30" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="-160" y1="80" x2="-50" y2="90" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Layer 2 -> Layer 3 -->
    <line x1="-50" y1="-90" x2="50" y2="-60" stroke="#e879f9" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="-50" y1="-90" x2="50" y2="0" stroke="#e879f9" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="-50" y1="-90" x2="50" y2="60" stroke="#e879f9" stroke-width="1.5" stroke-opacity="0.4"/>

    <line x1="-50" y1="-30" x2="50" y2="-60" stroke="#e879f9" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="-50" y1="-30" x2="50" y2="0" stroke="#e879f9" stroke-width="2.5" stroke-opacity="0.8"/>
    <line x1="-50" y1="-30" x2="50" y2="60" stroke="#e879f9" stroke-width="1.5" stroke-opacity="0.5"/>

    <line x1="-50" y1="30" x2="50" y2="-60" stroke="#e879f9" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="-50" y1="30" x2="50" y2="0" stroke="#e879f9" stroke-width="2.5" stroke-opacity="0.8"/>
    <line x1="-50" y1="30" x2="50" y2="60" stroke="#e879f9" stroke-width="2" stroke-opacity="0.7"/>

    <line x1="-50" y1="90" x2="50" y2="-60" stroke="#e879f9" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="-50" y1="90" x2="50" y2="0" stroke="#e879f9" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="-50" y1="90" x2="50" y2="60" stroke="#e879f9" stroke-width="2" stroke-opacity="0.6"/>

    <!-- Layer 3 -> Output Layer -->
    <line x1="50" y1="-60" x2="160" y2="-40" stroke="#f472b6" stroke-width="2.5" stroke-opacity="0.8"/>
    <line x1="50" y1="-60" x2="160" y2="40" stroke="#f472b6" stroke-width="1.5" stroke-opacity="0.5"/>

    <line x1="50" y1="0" x2="160" y2="-40" stroke="#f472b6" stroke-width="2.5" stroke-opacity="0.8"/>
    <line x1="50" y1="0" x2="160" y2="40" stroke="#f472b6" stroke-width="2.5" stroke-opacity="0.8"/>

    <line x1="50" y1="60" x2="160" y2="-40" stroke="#f472b6" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="50" y1="60" x2="160" y2="40" stroke="#f472b6" stroke-width="2.5" stroke-opacity="0.8"/>

    <!-- Nodes - Layer 1 (Input) -->
    <circle cx="-160" cy="-80" r="14" fill="#581c87" stroke="#c084fc" stroke-width="2.5"/>
    <circle cx="-160" cy="0" r="14" fill="#581c87" stroke="#c084fc" stroke-width="2.5"/>
    <circle cx="-160" cy="80" r="14" fill="#581c87" stroke="#c084fc" stroke-width="2.5"/>

    <!-- Nodes - Layer 2 (Hidden 1) -->
    <circle cx="-50" cy="-90" r="13" fill="#6b21a8" stroke="#d8b4fe" stroke-width="2.5"/>
    <circle cx="-50" cy="-30" r="15" fill="url(#dlNodeGrad)" stroke="#f3e8ff" stroke-width="2.5"/>
    <circle cx="-50" cy="30" r="15" fill="url(#dlNodeGrad)" stroke="#f3e8ff" stroke-width="2.5"/>
    <circle cx="-50" cy="90" r="13" fill="#6b21a8" stroke="#d8b4fe" stroke-width="2.5"/>

    <!-- Nodes - Layer 3 (Hidden 2) -->
    <circle cx="50" cy="-60" r="15" fill="url(#dlNodeGrad)" stroke="#f3e8ff" stroke-width="2.5"/>
    <circle cx="50" cy="0" r="16" fill="#ec4899" stroke="#fdf2f8" stroke-width="3"/>
    <circle cx="50" cy="60" r="15" fill="url(#dlNodeGrad)" stroke="#f3e8ff" stroke-width="2.5"/>

    <!-- Nodes - Layer 4 (Output) -->
    <circle cx="160" cy="-40" r="16" fill="#db2777" stroke="#fbcfe8" stroke-width="3"/>
    <circle cx="160" cy="40" r="16" fill="#db2777" stroke="#fbcfe8" stroke-width="3"/>
  </g>

  <!-- Brand & Category Typography -->
  <text x="640" y="475" text-anchor="middle" fill="#d8b4fe" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="6">THE GATEHUB • NEURAL ARCHITECTURE</text>
  <text x="640" y="535" text-anchor="middle" fill="#faf5ff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="1">DEEP LEARNING</text>
  <text x="640" y="575" text-anchor="middle" fill="#e9d5ff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" letter-spacing="2">NEURAL NETWORKS • COMPUTER VISION • TRANSFORMERS & LLMs</text>
</svg>

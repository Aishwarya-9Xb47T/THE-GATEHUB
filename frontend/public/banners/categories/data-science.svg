<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="dsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#115e59"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#dsBg)"/>

  <!-- Analytics Chart & Normal Distribution Curve -->
  <g transform="translate(640, 260)">
    <!-- Chart axes -->
    <line x1="-120" y1="60" x2="120" y2="60" stroke="#5eead4" stroke-width="2"/>
    <line x1="-120" y1="60" x2="-120" y2="-60" stroke="#5eead4" stroke-width="2"/>

    <!-- Bar chart columns -->
    <rect x="-100" y="20" width="22" height="40" rx="3" fill="url(#barGrad)"/>
    <rect x="-65" y="-10" width="22" height="70" rx="3" fill="url(#barGrad)"/>
    <rect x="-30" y="-45" width="22" height="105" rx="3" fill="url(#barGrad)"/>
    <rect x="5" y="-20" width="22" height="80" rx="3" fill="url(#barGrad)"/>
    <rect x="40" y="10" width="22" height="50" rx="3" fill="url(#barGrad)"/>
    <rect x="75" y="35" width="22" height="25" rx="3" fill="url(#barGrad)"/>

    <!-- Gaussian trend curve -->
    <path d="M -115 50 Q -30 -70 85 45" fill="none" stroke="#fef08a" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <text x="640" y="475" text-anchor="middle" fill="#5eead4" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="6">THE GATEHUB • DATA INTELLIGENCE</text>
  <text x="640" y="535" text-anchor="middle" fill="#f0fdfa" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="1">DATA SCIENCE & ANALYTICS</text>
  <text x="640" y="575" text-anchor="middle" fill="#99f6e4" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" letter-spacing="2">STATISTICS • BIG DATA • VISUALIZATION • QUANTITATIVE ANALYSIS</text>
</svg>

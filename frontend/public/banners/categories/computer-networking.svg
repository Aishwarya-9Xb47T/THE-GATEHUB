<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="netBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="50%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="netNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="netGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="netGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#netBg)"/>
  <rect width="100%" height="100%" fill="url(#netGrid)"/>

  <!-- Ambient Glow -->
  <circle cx="640" cy="285" r="280" fill="url(#netGlow)"/>

  <!-- Network Mesh & Nodes -->
  <g transform="translate(640, 260)">
    <!-- Interconnecting Lines -->
    <line x1="-160" y1="-50" x2="-60" y2="60" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="-60" y1="60" x2="60" y2="60" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.7"/>
    <line x1="60" y1="60" x2="160" y2="-50" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="-160" y1="-50" x2="0" y2="-100" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.6"/>
    <line x1="160" y1="-50" x2="0" y2="-100" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.6"/>
    <line x1="0" y1="-100" x2="-60" y2="60" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 4"/>
    <line x1="0" y1="-100" x2="60" y2="60" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 4"/>
    <line x1="-60" y1="60" x2="0" y2="0" stroke="#7dd3fc" stroke-width="3" stroke-opacity="0.8"/>
    <line x1="60" y1="60" x2="0" y2="0" stroke="#7dd3fc" stroke-width="3" stroke-opacity="0.8"/>
    <line x1="0" y1="-100" x2="0" y2="0" stroke="#7dd3fc" stroke-width="3" stroke-opacity="0.8"/>

    <!-- Central Switch / Router Node -->
    <circle cx="0" cy="0" r="32" fill="url(#netNodeGrad)" stroke="#bae6fd" stroke-width="3"/>
    <!-- Router arrows inside node -->
    <path d="M -12 -5 L -5 -12 L -5 -7 L 5 -7 L 5 -12 L 12 -5 L 5 2 L 5 -3 L -5 -3 L -5 2 Z" fill="#ffffff"/>
    <path d="M 12 5 L 5 12 L 5 7 L -5 7 L -5 12 L -12 5 L -5 -2 L -5 3 L 5 3 L 5 -2 Z" fill="#ffffff"/>

    <!-- Peripheral Nodes -->
    <circle cx="0" cy="-100" r="18" fill="#0369a1" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="0" cy="-100" r="7" fill="#bae6fd"/>

    <circle cx="-160" cy="-50" r="18" fill="#0369a1" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="-160" cy="-50" r="7" fill="#bae6fd"/>

    <circle cx="160" cy="-50" r="18" fill="#0369a1" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="160" cy="-50" r="7" fill="#bae6fd"/>

    <circle cx="-60" cy="60" r="18" fill="#0369a1" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="-60" cy="60" r="7" fill="#bae6fd"/>

    <circle cx="60" cy="60" r="18" fill="#0369a1" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="60" cy="60" r="7" fill="#bae6fd"/>
  </g>

  <!-- Brand & Category Typography -->
  <text x="640" y="475" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="6">THE GATEHUB • INFRASTRUCTURE & ARCHITECTURE</text>
  <text x="640" y="535" text-anchor="middle" fill="#f0f9ff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="1">COMPUTER NETWORKING</text>
  <text x="640" y="575" text-anchor="middle" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" letter-spacing="2">PROTOCOLS • ROUTING & SWITCHING • OSI & TCP/IP</text>
</svg>

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gatehub_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gatehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-the_gatehub}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gatehub_backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-gatehub}:${POSTGRES_PASSWORD:-password123}@postgres:5432/${POSTGRES_DB:-the_gatehub}?schema=public
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      UPLOAD_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: gatehub_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pg_data:
  uploads_data:

services:
  - type: web
    name: gatehub-backend
    env: node
    rootDir: backend
    region: singapore
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: gatehub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: gatehub-frontend
    env: static
    rootDir: frontend
    plan: starter
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://gatehub-backend.onrender.com/api

databases:
  - name: gatehub-db
    region: singapore
    plan: starter
    databaseName: the_gatehub
    user: gatehub

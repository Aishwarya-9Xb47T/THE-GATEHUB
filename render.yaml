services:
  # Existing Native Node services do NOT switch automatically when this file is pushed.
  # Dashboard: Settings → Build & Deploy → Source → Edit → Runtime = Docker.
  # Dockerfile path: ./backend/Dockerfile
  # Docker build context: .   (repository root — required for shared/lesson-body)
  # Root Directory: leave EMPTY (do not set backend)
  - type: web
    name: gatehub-backend
    runtime: docker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    region: singapore
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://gatehub-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://gatehub-frontend.onrender.com
      - key: API_URL
        value: https://gatehub-backend-mprr.onrender.com
      - key: GOOGLE_OAUTH_CALLBACK_URL
        value: https://gatehub-backend-mprr.onrender.com/api/auth/google/callback
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false

  - type: web
    name: gatehub-frontend
    env: static
    rootDir: frontend
    plan: starter
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://gatehub-backend-mprr.onrender.com/api
      - key: VITE_WS_BASE_URL
        value: https://gatehub-backend-mprr.onrender.com
      - key: VITE_WS_URL
        value: wss://gatehub-backend-mprr.onrender.com/yjs/

databases:
  - name: gatehub-db
    region: singapore
    plan: starter
    databaseName: the_gatehub
    user: gatehub

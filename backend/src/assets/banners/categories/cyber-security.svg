<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#065f46" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Ambient Glow -->
  <circle cx="640" cy="300" r="280" fill="url(#glowGrad)"/>

  <!-- Tech Circuit Lines -->
  <path d="M 100 200 L 300 200 L 380 280 L 520 280" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 4"/>
  <circle cx="520" cy="280" r="4" fill="#34d399" fill-opacity="0.8"/>
  <path d="M 1180 200 L 980 200 L 900 280 L 760 280" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 4"/>
  <circle cx="760" cy="280" r="4" fill="#34d399" fill-opacity="0.8"/>
  <path d="M 200 600 L 400 600 L 480 500 L 600 500" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.25"/>
  <circle cx="600" cy="500" r="4" fill="#34d399" fill-opacity="0.8"/>

  <!-- Shield Emblem -->
  <g transform="translate(640, 290)">
    <!-- Outer Shield Glow -->
    <path d="M 0 -110 L 85 -70 C 85 40, 0 115, 0 115 C 0 115, -85 40, -85 -70 Z" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.5"/>
    <!-- Main Shield -->
    <path d="M 0 -95 L 72 -60 C 72 32, 0 98, 0 98 C 0 98, -72 32, -72 -60 Z" fill="url(#shieldGrad)" stroke="#6ee7b7" stroke-width="2"/>
    <!-- Lock Icon -->
    <rect x="-24" y="-12" width="48" height="38" rx="7" fill="#022c22"/>
    <path d="M -15 -12 L -15 -28 C -15 -40, 15 -40, 15 -28 L 15 -12" fill="none" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="3" r="5" fill="#6ee7b7"/>
    <path d="M 0 8 L 0 16" stroke="#6ee7b7" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Brand & Category Typography -->
  <text x="640" y="475" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="6">THE GATEHUB • SECURITY SPECIALIZATION</text>
  <text x="640" y="535" text-anchor="middle" fill="#f0fdf4" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="1">CYBER SECURITY</text>
  <text x="640" y="575" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" letter-spacing="2">NETWORK DEFENSE • CRYPTOGRAPHY • ETHICAL HACKING</text>
</svg>

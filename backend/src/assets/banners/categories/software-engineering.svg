<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="seBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="seGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="seGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#64748b" stroke-width="0.75" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#seBg)"/>
  <rect width="100%" height="100%" fill="url(#seGrid)"/>

  <circle cx="640" cy="275" r="280" fill="url(#seGlow)"/>

  <!-- Code Bracket / Terminal Motif -->
  <g transform="translate(640, 260)">
    <!-- Terminal window outline -->
    <rect x="-140" y="-85" width="280" height="170" rx="14" fill="#090d16" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>
    <!-- Window controls -->
    <circle cx="-115" cy="-65" r="5" fill="#ef4444"/>
    <circle cx="-98" cy="-65" r="5" fill="#eab308"/>
    <circle cx="-81" cy="-65" r="5" fill="#22c55e"/>
    <line x1="-140" y1="-50" x2="140" y2="-50" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Code Brackets </ > -->
    <path d="M -60 -15 L -85 10 L -60 35" fill="none" stroke="url(#codeGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-15" y1="40" x2="15" y2="-20" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <path d="M 60 -15 L 85 10 L 60 35" fill="none" stroke="url(#codeGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="640" y="475" text-anchor="middle" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="6">THE GATEHUB • SYSTEM ARCHITECTURE</text>
  <text x="640" y="535" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="1">SOFTWARE ENGINEERING</text>
  <text x="640" y="575" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" letter-spacing="2">DATA STRUCTURES • ALGORITHMS • SYSTEM DESIGN & CLEAN CODE</text>
</svg>

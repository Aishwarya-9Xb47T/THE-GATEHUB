<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="cloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2e4e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cloudGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#cloudBg)"/>
  <circle cx="640" cy="275" r="280" fill="url(#cloudGlow)"/>

  <!-- Cloud Infrastructure & Infinity Loop -->
  <g transform="translate(640, 260)">
    <!-- Cloud shape -->
    <path d="M -60 10 C -80 10, -95 -5, -95 -25 C -95 -45, -75 -60, -55 -60 C -50 -85, -20 -105, 15 -105 C 50 -105, 80 -85, 85 -55 C 105 -55, 120 -40, 120 -20 C 120 0, 105 10, 85 10 Z" fill="none" stroke="url(#cloudGrad)" stroke-width="4"/>
    <!-- DevOps Infinity Loop -->
    <path d="M -50 40 C -75 40 -90 20 -90 0 C -90 -20 -75 -40 -50 -40 C -25 -40 -10 -20 0 0 C 10 20 25 40 50 40 C 75 40 90 20 90 0 C 90 -20 75 -40 50 -40 C 25 -40 10 -20 0 0 C -10 20 -25 40 -50 40 Z" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <text x="640" y="475" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="6">THE GATEHUB • INFRASTRUCTURE & AUTOMATION</text>
  <text x="640" y="535" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="1">CLOUD & DEVOPS</text>
  <text x="640" y="575" text-anchor="middle" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" letter-spacing="2">DOCKER • KUBERNETES • CI/CD • AWS & CLOUD ARCHITECTURE</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="aiSparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#3730a3" stop-opacity="0"/>
    </linearGradient>
    <pattern id="aiGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#818cf8" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#aiBg)"/>
  <rect width="100%" height="100%" fill="url(#aiGrid)"/>

  <!-- Ambient Glow -->
  <circle cx="640" cy="275" r="280" fill="url(#aiGlow)"/>

  <!-- AI Brain / Spark Matrix -->
  <g transform="translate(640, 260)">
    <!-- Concentric Target Rings -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6 6"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#a78bfa" stroke-width="2" stroke-opacity="0.35"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-opacity="0.5" stroke-dasharray="8 4"/>

    <!-- Central AI Multi-Point Spark -->
    <path d="M 0 -75 Q 0 0 -75 0 Q 0 0 0 75 Q 0 0 75 0 Q 0 0 0 -75 Z" fill="url(#aiSparkGrad)"/>

    <!-- Secondary diagonal mini sparks -->
    <path d="M 0 -35 Q 0 0 -35 0 Q 0 0 0 35 Q 0 0 35 0 Q 0 0 0 -35 Z" fill="#ffffff" fill-opacity="0.9"/>

    <circle cx="0" cy="0" r="10" fill="#ffffff"/>

    <!-- Orbital Data Nodes -->
    <circle cx="-95" cy="0" r="8" fill="#60a5fa" stroke="#dbeafe" stroke-width="2"/>
    <circle cx="95" cy="0" r="8" fill="#ec4899" stroke="#fce7f3" stroke-width="2"/>
    <circle cx="0" cy="-95" r="8" fill="#a855f7" stroke="#f3e8ff" stroke-width="2"/>
    <circle cx="0" cy="95" r="8" fill="#818cf8" stroke="#e0e7ff" stroke-width="2"/>

    <circle cx="-67" cy="-67" r="6" fill="#38bdf8"/>
    <circle cx="67" cy="-67" r="6" fill="#f472b6"/>
    <circle cx="-67" cy="67" r="6" fill="#818cf8"/>
    <circle cx="67" cy="67" r="6" fill="#c084fc"/>
  </g>

  <!-- Brand & Category Typography -->
  <text x="640" y="475" text-anchor="middle" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="6">THE GATEHUB • ARTIFICIAL INTELLIGENCE & MACHINE LEARNING</text>
  <text x="640" y="535" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="1">AI / ML ENGINEERING</text>
  <text x="640" y="575" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" letter-spacing="2">STATISTICAL LEARNING • PREDICTIVE MODELING • INTELLIGENT SYSTEMS</text>
</svg>

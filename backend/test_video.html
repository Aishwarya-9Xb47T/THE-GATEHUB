<!DOCTYPE html>
<html>
<head>
  <style>
    .aspect-video {
      aspect-ratio: 16 / 9;
    }
    .bg-black {
      background-color: rgb(0 0 0);
    }
    .rounded-lg {
      border-radius: 0.5rem;
    }
    .overflow-hidden {
      overflow: hidden;
    }
    .w-full {
      width: 100%;
    }
    .h-full {
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="aspect-video bg-black rounded-lg overflow-hidden">
    <video
      id="test-vid"
      src="http://localhost:5000/uploads/resources/Media%20Player%202025-12-14%2000-07-09.mp4"
      controls
      autoplay="false"
      class="w-full h-full"
    ></video>
  </div>
</body>
</html>

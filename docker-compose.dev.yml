version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=overleaf
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=overleaf_clone
    ports:
      - "5433:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    restart: always

  minio:
    image: minio/minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_dev:/data
    restart: always

  latex_engine:
    image: blang/latex:ctanbasic
    container_name: latex_engine
    volumes:
      - ./latex-temp:/data
    working_dir: /data
    command: tail -f /dev/null
    restart: always

volumes:
  pg_data_dev:
  redis_data_dev:
  minio_data_dev:
